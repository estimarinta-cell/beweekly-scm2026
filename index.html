<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Weekly Inspection - BTR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        
        body { 
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                            url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            margin: 0;
            padding: 10px;
        }

        .dashboard-container {
            max-width: 1100px;
            margin: 20px auto;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 12px;
            margin-top: 25px;
        }

        .menu-card {
            background: #ffffff;
            padding: 15px 10px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 2px solid #007bbd;
            font-weight: bold;
            color: #007bbd;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 85px;
            text-transform: uppercase;
            font-size: 11px;
            transition: 0.3s;
        }

        .menu-card:active { transform: scale(0.95); background: #007bbd; color: white; }

        #formOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            overflow-y: auto;
            padding: 20px 10px;
            z-index: 9999;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 25px 15px 15px 15px;
            border-radius: 8px;
            position: relative; /* Dasar posisi tombol X */
        }

        /* REVISI POSISI TOMBOL X TEPAT DI UJUNG KANAN ATAS FORM */
        .close-form-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 30px;
            height: 30px;
            background: #C22F43;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .header { display: flex; border: 2px solid #333; margin-bottom: 15px; }
        .logo { width: 80px; border-right: 2px solid #333; text-align: center; padding: 5px; display: flex; flex-direction: column; justify-content: center; align-items: center;}
        .logo-text { font-size: 7px; font-weight: bold; line-height: 1; margin-top: 3px; }
        .header-content { background: #007bbd; color: #fff; padding: 10px; text-align: center; flex: 1; font-size: 13px; }
        .header-info { display: flex; flex-direction: column; padding: 5px; font-size: 10px; border-top: 2px solid #333; }

        .table-wrapper { overflow: visible !important; margin-bottom: 20px; border: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; min-width: 450px; }
        th, td { border: 1px solid #333; padding: 10px; font-size: 12px; }
        th { background: #f2f2f2; }

        .form-section { border: 2px solid #333; margin-bottom: 15px; }
        .form-row { display: flex; flex-direction: column; border-bottom: 1px solid #333; }
        .form-label { width: 100%; padding: 8px; background: #f8f8f8; font-weight: bold; font-size: 12px; }
        .form-input { padding: 8px; flex: 1; }
        input[type="text"], input[type="date"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }

        .photo-preview {
            display: none;
            width: 100%; 
            max-height: 350px; 
            object-fit: contain; 
            margin-top: 8px;
            border: 1px dashed #ccc;
        }

        .btn-upload-hidden { display: none !important; }

        tr { page-break-inside: avoid !important; break-inside: avoid !important; }
        img { page-break-inside: avoid !important; max-width: 100%; display: block; margin: 5px auto; }

        .finding-cell { display: flex; flex-direction: column; min-height: 80px; }
        .finding-input { border: none !important; outline: none; padding: 5px; min-height: 40px; font-style: italic; color: #333; }
        .finding-divider { border: none !important; margin: 0; padding: 0; }
        
        @media print {
            .action-buttons, .close-form-btn, input[type="file"], button { display: none !important; }
        }

        .action-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn { width: 100%; padding: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .btn-print { background: #007bbd; color: white; }
        .btn-reset { background: #ffc107; color: #333; }

        @media (min-width: 768px) {
            .dashboard-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
            .form-row { flex-direction: row; }
            .form-label { width: 200px; border-right: 1px solid #333; }
            .header-info { flex-direction: row; justify-content: space-between; font-size: 11px; }
            .logo { width: 120px; }
            .logo-text { font-size: 10px; }
            .action-buttons { flex-direction: row; }
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h1 style="color: #005b8e; font-size: 22px; margin: 0;">SISTEM MANAJEMEN INSPEKSI</h1>
    <p style="color: #666; font-size: 13px; margin-top: 5px;">PT BATUTUA TEMBAGA RAYA</p>
    <div class="dashboard-grid" id="menuGrid"></div>
</div>

<div id="formOverlay">
    <div class="container" id="printableArea">
        <button class="close-form-btn" onclick="closeForm()">&times;</button>
        
        <div class="header">
            <div class="logo">
                <svg width="40" height="35" viewBox="0 0 100 90"><path d="M50 5 L95 85 H5 Z" fill="#C22F43"/></svg>
                <div class="logo-text">PT BATUTUA<br>TEMBAGA RAYA</div>
            </div>
            <div style="flex:1">
                <div class="header-content">
                    <b>FORM (FRM)</b><br>
                    <span id="formTitleText" style="text-decoration: underline; font-weight: bold; font-size: 14px;">WEEKLY INSPECTION</span>
                </div>
                <div class="header-info">
                    <div>No Dok: <b>BTR-SCM-FRM-000</b></div>
                    <div>Effective: <b>01-Jan-2026</b></div>
                    <div>Rev: <b>1.0</b></div>
                </div>
            </div>
        </div>

        <div class="form-section" id="infoSection"></div>

        <h3 style="font-size: 15px; border-left: 4px solid #007bbd; padding-left: 10px;">INSPECTION CHECK LIST</h3>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th width="30">No</th>
                        <th>Item Pemeriksaan & Foto</th>
                        <th width="45">Ya</th>
                        <th width="45">Tdk</th>
                    </tr>
                </thead>
                <tbody id="checklistContent"></tbody>
            </table>
        </div>

        <h3 style="font-size: 15px; border-left: 4px solid #C22F43; padding-left: 10px;">TEMUAN & PERBAIKAN</h3>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th width="30">No</th>
                        <th>Uraian Temuan & Tindakan</th>
                        <th width="100">PIC & Target</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td align="center">1</td>
                        <td class="finding-cell">
                            <div contenteditable="true" class="finding-input" placeholder="Isi temuan..."></div>
                            <div class="finding-divider"><div contenteditable="true" class="finding-input" placeholder="Isi perbaikan..."></div></div>
                        </td>
                        <td>
                            <input type="text" placeholder="PIC" style="margin-bottom:5px; font-size:11px;">
                            <input type="date" style="font-size:11px;">
                        </td>
                    </tr>
                    <tr>
                        <td align="center">2</td>
                        <td class="finding-cell">
                            <div contenteditable="true" class="finding-input" placeholder="Isi temuan..."></div>
                            <div class="finding-divider"><div contenteditable="true" class="finding-input" placeholder="Isi perbaikan..."></div></div>
                        </td>
                        <td>
                            <input type="text" placeholder="PIC" style="margin-bottom:5px; font-size:11px;">
                            <input type="date" style="font-size:11px;">
                        </td>
                    </tr>
                    <tr>
                        <td align="center">3</td>
                        <td class="finding-cell">
                            <div contenteditable="true" class="finding-input" placeholder="Isi temuan..."></div>
                            <div class="finding-divider"><div contenteditable="true" class="finding-input" placeholder="Isi perbaikan..."></div></div>
                        </td>
                        <td>
                            <input type="text" placeholder="PIC" style="margin-bottom:5px; font-size:11px;">
                            <input type="date" style="font-size:11px;">
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="action-buttons">
            <button class="btn btn-print" onclick="exportPDF()">SIMPAN PDF</button>
            <button class="btn btn-reset" onclick="resetForm()">RESET FORM</button>
        </div>
    </div>
</div>

<script>
    const inspectionLibrary = {
        'Container T': ["Container bersih & rapi tidak ada tumpahan/sampah", "Struktur Container tidak penyok,bocor dan karat", "Pintu container bisa di buka dan tutup dengan baik", "Lantai container kering tidak licin dan kotor", "Blower berfungsi dengan baik", "Penataan bahan kimia rapi dan sesuai jenis", "Kemasan tidak bocor atau penyok", "Spill kit tersedia dan lengkap", "Container dikunci", "Safety Shower/aye wash berfungsi dengan baik", "APAR tersedia di lokasi,presure normal dan sudah di inspeksi", "Sign B3 sesuai dengan jenis barang yg di simpan", "MSDS tersedia dan masih berlaku", "Penerangan cukup"],
        'Container S': ["Container bersih & rapi tidak ada tumpahan/sampah", "Struktur Container tidak penyok,bocor dan karat", "Pintu container bisa di buka dan tutup dengan baik", "Lantai container kering tidak licin dan kotor", "Air Conditioner berfungsi dengan baik", "Penataan bahan kimia rapi dan sesuai jenis", "Kemasan tidak bocor atau penyok", "Spill kit tersedia dan lengkap", "Container dikunci", "Safety Shower/aye wash berfungsi dengan baik", "APAR tersedia di lokasi,presure normal dan sudah di inspeksi", "Sign B3 sesuai dengan jenis barang yg di simpan", "MSDS tersedia dan masih berlaku", "Penerangan cukup"],
        'Reagent Storage Yard': ["Area bersih dan bebas tumpahan", "Drum IBC,Isotank dalam kondisi baik (tidak bocor/ korosi)", "Barang dengan kemasan karung tidak bocor", "Barang di simpan sesuai jenis", "APAR tersedia dan dalam kondisi baik", "Tidak ada barang yg di simpan di yard tanpa cover", "Spill kit lengkap dan siap pakai", "MSDS tersedia dan valid", "Eye wash/safety shower berfungsi dengan baik", "Akses terbatas dan terkunci", " Tidak ada aktivitas tidak aman"],
        'Fuel Station': ["Lantai bersih, tidak licin, bebas tumpahan", "Pompa fuel Layak dioperasikan", "Hose & nozzle Tidak bocor/retak", "Auto cut-off nozzle Berfungsi", "Grounding/earthing Terpasang & diuji", "APAR berfungsi dengan baik", "Wheel Chock tersedia dan dalam kondisi baik", "Spill kit tersedia & lengkap", "Limbah B3 Disimpan sesuai regulasi", "Tumpahan fuel Ditangani dengan baik", "Safety Shower / Eyewash berfungsi dengan baik", "Kotak sampah kontaminasi dan General tersedia", "Area Fuel Station Bersih dari sampah", "Pump dan Fuel Gun berfungsi dengan baik"],
        'Oil Boom': ["Tidak ada kebocoran pada dinding, dasar", "Tidak terjadi overflow / meluap, level cairan masih dalam batas aman (> 20 cm di bawah cover)", "Tidak ada sampah asing didalam fuel trap (plastik, daun, kertas)", "Outlet & pipa drain tidak tersumbat, aliran lancar", "Endapan sludge / lumpur tidak berlebihan dan belum melewati batas cleaning (ketebalan lumpur < 20 cm)", "Cover / grating terpasang aman dan tidak rusak", "Area sekitar bersih dari tumpahan fuel/oli dan tidak licin", "Tidak ada bau menyengat berlebihan", "Spill kit tersedia & siap digunakan di area fuel trap", "Temuan & kondisi dicatat di log inspeksi (termasuk foto bila ada abnormal)"],
        'Oil Storage': ["Area bersih & rapi", "Tidak ada tumpahan oli/minyak", "Tidak ada genangan air", "Akses jalan aman & tidak licin", "Penerangan memadai", "Drum / kemasan tidak bocor", "Tidak ada karat/korosi berat", "Drum dalam keadaan tertutup rapat", "Label jenis oil jelas & terbaca", "APAR tersedia dan dalam kondisi baik", "Spill kit tersedia & lengkap", "Sign B3 tersedia dan dan sesuai", "MSDS tersedia dan valid", "Tidak ada sumber api di area", "Drum / IBC disusun rapi sesuai Jenis"],
        'Main Tank Fuel': ["Area bersih & bebas tumpahan", "Tidak ada genangan air di sekitar tangki", "Akses jalan aman & tidak licin", "Pagar & pembatas area baik", "Rambu K3 terpasang & terbaca", "Badan tangki tidak bocor/retak", "Cat baikTidak ada korosi berlebihan", "Cat pelindung masih baik", "Name plate & kapasitas terbaca", "Fondasi tangki stabil", "Pipa inlet/outlet tidak bocor", "Valve befungsi normal", "Penyangga pipa kokoh", "Bundwal tanggul utuh", "Drain bundwall tertutup dan terkunci"],
        'Gas Storage': ["Area bersih dan rapi", "MSDS tersedia dan mudah di akses", "Penerangan cukup dan aman", "Posisi tabung tersusun dengan rapi, tegak and dirantai", "Valve cap terpasang saat tidak di gunakan", "Kondisi fisik tabung tidak penyok/korosi", "Pemisahan tabung Full dan Empty terpisah", "tidak terdeteksi bau atau bocor", "APAR tersedia di lokasi,presure normal dan sudah di inspeksi", "Rambu larangan tersedia", "Tidak ada sumber api di area gas storage", "Tabung gas di simpan sesuai jenis", "Keranjang di sertifikasi dan valid"],
        'Jetty Area': ["Area bersih dan tertata rapi", "Bollard / mooring point terpasang kuat", "Fender jetty dalam kondisi baik", "Handrail & guardrail lengkap dan kokoh", "Tangga jetty & akses naik turun aman", "Spill kit lengkap & siap pakai", "Eye wash & safety shower berfungsi", "Penerangan area jetty berfungsi", "Tidak ada potensi pencemaran laut", "Tidak ada tumpahan BBM/oli di area Jetty", "Apar tersedia dan berfungsi dengan baik"],
        'Laydown Yard': ["Area bersih,bebas sampah dan material tidak terpakai", "Permukaan jalan yard rata tidak berlubang dan tidak licin", "Drainase berfungsi baik dan tidak tersumbat", "Penerangan area cukup saing dan malam", "Material di tata rapi dan stabil", "Tidak ada container overstack dan melebihi batas aman", "Pallet dalam kondisi baik", "APAR tersedia dan dalam kondisi baik", " Area Aman dari potensi kebakaran"],
        'Warehouse Area': ["Lantai bersih, tidak licin, bebas tumpahan", "Barang tersusun rapi sesuai area", "Jalur forklift & pejalan kaki jelas", "Tempat sampah tersedia & tidak penuh", "Kondisi rak tidak rusak / bengkok", "Beban rak sesuai kapasitas", "Label kapasitas rak terpasang", "Semua barang disimpan dalam keadaan aman", "Barang diberi label & identitas jelas", "Pallet dalam kondisi baik", "APAR tersedia, Segel & pressure normal & mudah diakses", "Rambu K3 & jalur evakuasi jelas", "Kabel tidak terkelupas / semrawut", "Penerangan memandai", "CCTV / sistem keamanan berfungsi", "Tagging electrical, lifting & tangga Valid"]
    };

    const overlay = document.getElementById('formOverlay');
    const checklistContent = document.getElementById('checklistContent');
    let currentArea = '';

    Object.keys(inspectionLibrary).forEach(area => {
        const card = document.createElement('div');
        card.className = 'menu-card';
        card.innerText = area;
        card.onclick = () => openForm(area);
        document.getElementById('menuGrid').appendChild(card);
    });

    const fields = ["Department", "Lokasi", "Tanggal Inspeksi", "Di Inspeksi Oleh", "Supervisor", "Head Dept"];
    document.getElementById('infoSection').innerHTML = fields.map(f => `
        <div class="form-row">
            <div class="form-label">${f}</div>
            <div class="form-input"><input type="${f.includes("Tanggal") ? "date" : "text"}"></div>
        </div>
    `).join('');

    function openForm(area) {
        currentArea = area;
        overlay.style.display = 'block';
        document.getElementById('formTitleText').innerText = "WEEKLY INSPECTION - " + area.toUpperCase();
        renderChecklist(area);
        document.body.style.overflow = 'hidden';
        overlay.scrollTo(0,0);
    }

    function closeForm() {
        overlay.style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    function renderChecklist(area) {
        const items = inspectionLibrary[area] || [];
        checklistContent.innerHTML = items.map((item, i) => `
            <tr>
                <td align="center">${i+1}</td>
                <td>
                    <div style="margin-bottom: 8px;"><b>${item}</b></div>
                    <input type="file" id="f${i}" hidden accept="image/*" onchange="handleImage(${i})">
                    <button id="btnUpload${i}" onclick="document.getElementById('f${i}').click()" style="background:#28a745; color:white; border:none; padding:6px 12px; border-radius:4px; font-size:10px;">📷 AMBIL FOTO</button>
                    <img class="photo-preview" id="img${i}">
                </td>
                <td align="center"><input type="radio" name="r${i}"></td>
                <td align="center"><input type="radio" name="r${i}"></td>
            </tr>
        `).join('');
    }

    function handleImage(i) {
        const file = document.getElementById("f"+i).files[0];
        const img = document.getElementById("img"+i);
        const btn = document.getElementById("btnUpload"+i);
        
        if (file) {
            const reader = new FileReader();
            reader.onload = e => { 
                img.src = e.target.result; 
                img.style.display = "block"; 
                if(btn) btn.classList.add('btn-upload-hidden');
            };
            reader.readAsDataURL(file);
        }
    }

    function resetForm() {
        if(confirm("Hapus semua data input?")) {
            renderChecklist(currentArea);
            document.querySelectorAll('input[type="text"]').forEach(i => i.value = '');
            document.querySelectorAll('[contenteditable]').forEach(i => i.innerText = '');
        }
    }

    function exportPDF() {
        const element = document.getElementById('printableArea');
        const actionBtns = document.querySelector('.action-buttons');
        const closeBtn = document.querySelector('.close-form-btn');
        
        actionBtns.style.display = 'none';
        closeBtn.style.display = 'none';

        const opt = {
            margin: [10, 5, 10, 5],
            filename: `BTR_Inspection_${currentArea}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, letterRendering: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            actionBtns.style.display = 'flex';
            closeBtn.style.display = 'flex';
        });
    }
</script>
</body>
</html>
